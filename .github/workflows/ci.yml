name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check blog and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build blog
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pack components and template
        run: npm pack

      - name: Build an independent content repository
        run: npm run smoke:package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ak-blog-${{ github.sha }}
          path: '*.tgz'
          if-no-files-found: error
