name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only, do not publish'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build blog
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pack components and template
        run: npm pack

      - name: Build an independent content repository
        run: npm run smoke:package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ak-blog-${{ github.sha }}
          path: '*.tgz'
          if-no-files-found: error

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish ./*.tgz --access public
